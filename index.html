const TABS=['总览','D1','D2','D3','D4','D5','待办','贴士'];
const tabBar=document.getElementById('tabBar');
let currentIdx=0;
TABS.forEach((t,i)=>{const b=document.createElement('button');b.className='tb'+(i===0?' active':'');b.textContent=t;b.dataset.idx=i;tabBar.appendChild(b)});
tabBar.addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;selectTab(+b.dataset.idx)});

const page=document.getElementById('page');
function selectTab(idx){
  const nextIdx=Math.max(0,Math.min(TABS.length-1,idx));
  const direction=nextIdx-currentIdx;
  if(direction===0)return;
  currentIdx=nextIdx;
  tabBar.querySelectorAll('.tb').forEach((button,i)=>button.classList.toggle('active',i===nextIdx));
  const activeTab=tabBar.querySelector(`.tb[data-idx="${nextIdx}"]`);
  if(activeTab)activeTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  renderPage(nextIdx,direction);
}

function renderPage(idx,direction=0){
  page.classList.remove('page-flip-next','page-flip-prev');
  render(idx);
  if(!direction)return;
  void page.offsetWidth;
  page.classList.add(direction>0?'page-flip-next':'page-flip-prev');
}

let swipePointerId=null,swipeStartX=0,swipeStartY=0,swipeStartTarget=null,suppressClick=false;
const SWIPE_THRESHOLD=44;
function isInteractiveTarget(target){
  return target instanceof Element && target.closest('button,a,input,textarea,select,summary,[contenteditable="true"]');
}
function resetSwipe(){
  swipePointerId=null;swipeStartTarget=null;page.classList.remove('swipe-dragging');
}
page.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(isInteractiveTarget(e.target))return;
  swipePointerId=e.pointerId;swipeStartX=e.clientX;swipeStartY=e.clientY;swipeStartTarget=e.target;
  page.classList.add('swipe-dragging');
  page.setPointerCapture?.(e.pointerId);
});
page.addEventListener('pointermove',e=>{
  if(e.pointerId!==swipePointerId)return;
  const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
  if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.1)e.preventDefault();
},{passive:false});
page.addEventListener('pointerup',e=>{
  if(e.pointerId!==swipePointerId)return;
  const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
  const isHorizontal=Math.abs(dx)>Math.abs(dy)*1.1;
  const isSwipe=isHorizontal&&Math.abs(dx)>=SWIPE_THRESHOLD&&!isInteractiveTarget(swipeStartTarget);
  if(isSwipe){
    suppressClick=true;
    window.setTimeout(()=>{suppressClick=false},600);
    selectTab(currentIdx+(dx<0?1:-1));
  }
  resetSwipe();
});
page.addEventListener('click',e=>{
  if(!suppressClick)return;
  e.preventDefault();e.stopPropagation();suppressClick=false;
},true);
page.addEventListener('pointercancel',resetSwipe);
page.addEventListener('lostpointercapture',resetSwipe);
page.addEventListener('animationend',e=>{
  if(e.animationName==='page-flip-next'||e.animationName==='page-flip-prev')page.classList.remove('page-flip-next','page-flip-prev');
});

function render(idx){if(idx===0)renderOverview();else if(idx<=5)renderDay(idx-1);else if(idx===6)renderTodo();else renderTips()}

}

function renderDay(idx){
  const locs=LOCATIONS[idx],color=DAY_COLORS[idx],label=DAY_LABELS[idx],date=DAY_DATES[idx];
  let h=`<div class="day-header"><span>${label} · ${date}</span><button class="day-route-btn" onclick="toggleRoute(${idx})">🗺️ 当日路线</button></div>`;
  h+=`<div class="day-route-overlay" id="route-${idx}"><svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">`;
  const pts=[];for(let i=0;i<locs.length;i++){pts.push({x:30+(i/(locs.length-1||1))*340,y:100+Math.sin(i*0.8)*30+Math.cos(i*1.2)*15})}
  if(pts.length>1){let d=`M${pts[0].x},${pts[0].y}`;for(let i=1;i<pts.length;i++)d+=` Q${(pts[i-1].x+pts[i].x)/2},${(pts[i-1].y+pts[i].y)/2-20} ${pts[i].x},${pts[i].y}`;h+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;pts.forEach((p,i)=>{h+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}"/><text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="9" fill="${color}" font-family="sans-serif">${locs[i].time}</text>`})}
  h+=`</svg></div><div class="day-timeline">`;
  locs.forEach(l=>{const badge=l.need?'<span class="dt-badge need">⚠️需注意</span>':'';const gmapUrl=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.gmap||l.name)}`;h+=`<div class="dt-item"><div class="dt-dot" style="background:${color}"></div><div class="dt-card" onclick="window.open('${gmapUrl}','_blank')"><div class="dt-time">${l.time}</div><div class="dt-name">${l.name}${badge}</div><div class="dt-desc">${l.desc}</div>${l.budget?`<span class="dt-budget">${l.budget}</span>`:''}<div class="dt-gmap">🗺️ Google Map 导航</div></div></div>`});
  h+=`</div>`;page.innerHTML=h;
}
